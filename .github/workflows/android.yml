name: Android CI

on:
  push:
    branches: [ "main", "feat/**" ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon --continue assembleDebug 2>&1 | tee build.log
      - name: Summarize compiler errors
        if: failure()
        run: |
          echo "==== ERROR SUMMARY ===="
          grep -E "^e: |^w: .*(deprecated)?|error:|What went wrong|Could not resolve|> Could not find" build.log | grep -v "^w: " | sort -u | head -n 300
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: codein-debug-apk
          path: app/build/outputs/apk/debug/*.apk
